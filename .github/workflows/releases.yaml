name: Publishing Releases

on:
  push:
    tags:
      - "*"

env:
  MIX_ENV: prod
  SHELL: /usr/bin/bash
  IMAGE_NAME: ghcr.io/deployex/deployex

jobs:
  build:
    if: github.event.base_ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        otp: [28, 29]
        arch: [amd64, arm64]
        # An amd64 asset has no architecture in its name, so existing installs keep working.
        include:
          - arch: amd64
            runner: ubuntu-24.04
            suffix: ""
          - arch: arm64
            runner: ubuntu-24.04-arm
            suffix: "-arm64"
    env:
      ARTIFACT_NAME: deployex-ubuntu-24.04${{ matrix.suffix }}-otp-${{ matrix.otp }}.tar.gz
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + tags so we can build the previous release and let
          # Jellyfish generate the hot-upgrade appup into this release.
          fetch-depth: 0

      - name: Install libcap-dev [recommended by erlexec]
        run: sudo apt-get install libcap-dev -y

      - name: Copy .tool-versions
        run: cp devops/releases/otp-${{ matrix.otp }}/.tool-versions .

      - name: Setup BEAM
        uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      # Mirror hot_upgrade.yaml: build the previous release, then build this tag
      # with --force in the same sequence, so Jellyfish sees the previous app
      # versions in the release lib and emits the relup/appup into this release.
      # First release (no previous tag) is a plain base build.
      - name: Compile and generate the release (with hot-upgrade appup)
        run: |
          TAG="${{ github.ref_name }}"
          PREV=$(git tag --sort=version:refname | awk -v cur="$TAG" '$0==cur{print prev} {prev=$0}')
          if [ -n "$PREV" ]; then
            echo "Previous release: $PREV — building $PREV then $TAG so $PREV -> $TAG carries an appup"
            # The setup step copies the per-OTP .tool-versions over the tracked root file,
            # so restore it or git aborts the checkout on the dirty tracked file. Do not copy
            # it again after a checkout: $PREV may not have this OTP line's directory, and
            # setup-beam has already installed the toolchain (mix does not read the file).
            git checkout -- .tool-versions
            git checkout --quiet "$PREV"
            mix do deps.get + compile
            mix assets.deploy
            mix release
            git checkout --quiet "$TAG"
            mix do deps.get + compile --force --warnings-as-errors
            mix assets.deploy
            mix release
          else
            echo "No previous tag; building $TAG as a base release (no appup)"
            mix do deps.get + compile --warnings-as-errors
            mix assets.deploy
            mix release
          fi

      - name: Rename Artifact
        # After the two-phase build _build/prod may also hold the previous
        # tarball; take the most recently built one (this tag's release).
        run: mv "$(ls -t _build/prod/deployex-*.tar.gz | head -1)" ${{ env.ARTIFACT_NAME }}

      - name: Calculate checksum
        run: sha256sum ${{ env.ARTIFACT_NAME }} > ${{ env.ARTIFACT_NAME }}.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.ARTIFACT_NAME }}
            ${{ env.ARTIFACT_NAME }}.sha256

  # Each arch is built natively (no QEMU emulation) and pushed by digest only,
  # with no tag yet - dockerManifest below combines both digests into the one
  # multi-arch tag people actually pull.
  dockerImage:
    if: github.event.base_ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: devops/docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: org.opencontainers.image.source=https://github.com/deployex/deployex
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  dockerManifest:
    if: github.event.base_ref == 'refs/heads/main'
    needs: [dockerImage]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          TAG="${{ github.ref_name }}"
          docker buildx imagetools create \
            -t ${{ env.IMAGE_NAME }}:$TAG \
            -t ${{ env.IMAGE_NAME }}:latest \
            $(printf "${{ env.IMAGE_NAME }}@sha256:%s " *)

      - name: Inspect the published manifest
        run: docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:${{ github.ref_name }}

  copyInstaller:
    if: github.event.base_ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Prepare installer and checksum
        run: |
          cp devops/installer/deployex.sh .
          sha256sum deployex.sh > deployex.sh.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: deployex.sh
          path: |
            deployex.sh
            deployex.sh.sha256

  copyChangelog:
    if: github.event.base_ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/upload-artifact@v7
        with:
          name: CHANGELOG.md
          path: CHANGELOG.md

  createRelease:
    if: github.event.base_ref == 'refs/heads/main'
    name: Publish artifacts to the release
    needs: [build, copyInstaller, copyChangelog]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all artefacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create checksums file
        run: cat *.sha256 > checksum.txt

      - name: Release the files
        uses: ncipollo/release-action@v1
        with:
          artifacts: "deployex-*.tar.gz, deployex.sh, checksum.txt"
          bodyFile: "CHANGELOG.md"
