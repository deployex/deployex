apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "deployex.fullname" . }}-config
  labels:
    {{- include "deployex.labels" . | nindent 4 }}
data:
  # Keys end up alphabetised (toYaml of a Go map), unlike the guide's own example -
  # harmless, deployex.yaml is a map to DeployEx, not an ordered document.
  deployex.yaml: |
    {{- include "deployex.config" . | nindent 4 }}
