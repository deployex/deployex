{{- if and .Values.secret.create .Values.secret.existingSecret }}
{{- fail "secret.create and secret.existingSecret are both set - pick one. create is for a trial only, existingSecret is for everything else." }}
{{- end }}
{{- if not (or .Values.secret.create .Values.secret.existingSecret) }}
{{- fail "DeployEx needs a Secret: set secret.existingSecret to one you created (DEPLOYEX_SECRET_KEY_BASE, DEPLOYEX_ERLANG_COOKIE, DEPLOYEX_ADMIN_HASHED_PASSWORD), or secret.create with its values for a trial." }}
{{- end }}
{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "deployex.fullname" . }}
  labels:
    {{- include "deployex.labels" . | nindent 4 }}
type: Opaque
stringData:
  DEPLOYEX_SECRET_KEY_BASE: {{ required "secret.secretKeyBase is required when secret.create is true" .Values.secret.secretKeyBase | quote }}
  DEPLOYEX_ERLANG_COOKIE: {{ required "secret.erlangCookie is required when secret.create is true" .Values.secret.erlangCookie | quote }}
  DEPLOYEX_ADMIN_HASHED_PASSWORD: {{ required "secret.adminHashedPassword is required when secret.create is true" .Values.secret.adminHashedPassword | quote }}
  {{- with .Values.secret.apiTokens }}
  DEPLOYEX_API_TOKENS: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.oauthClientSecret }}
  DEPLOYEX_OAUTH_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
{{- end }}
