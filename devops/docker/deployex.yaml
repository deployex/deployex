# DeployEx in a container, for the trial of guides/docs/docker/README.md
account_name: "local"
hostname: "localhost"
port: 5001
scheme: "http"
check_origin: false

# The releases are read from a directory, mounted from the host or from a volume
release_adapter: "local"
release_bucket: "/bucket"

# DeployEx reads its own secrets from the environment of the container
secrets_adapter: "env"
secrets_path: "not-used"

version: "0.10.0"
otp_version: 28
os_target: "ubuntu-24.04"
otp_tls_certificates: "/certs"
enable_release_check: false

# What the applications print goes to the output of the container too, where
# docker logs, kubectl logs and a log collector read it
monitored_app_log_stdout: true

applications:
  - name: "myphoenixapp"
    language: "elixir"
    replicas: 1
    deploy_rollback_timeout_ms: 600000
    deploy_schedule_interval_ms: 5000
    # One replica uses 4000 or 4001: a full deployment starts the new instance on the
    # free one before it stops the previous. nginx.conf lists both
    replica_ports:
      - key: PORT
        base: 4000
    env:
      - key: PHX_SERVER
        value: "true"
      - key: PHX_HOST
        value: "localhost"
      - key: SECRET_KEY_BASE
        value: "e4CXwPpjrAJp9NbRobS8dXmOHfn0EBpFdhZlPmZo1y3N/BzW9Z/k7iP7FjMk+chi"
