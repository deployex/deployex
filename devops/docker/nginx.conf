# The one port the outside sees. DeployEx runs the application on base + 0..replicas, and
# moves it between them on a full deployment, so every port it can use is listed: a
# request to one where nothing listens is refused, and nginx sends it to the next.
events {}

http {
  upstream application {
    server 127.0.0.1:4000 max_fails=1 fail_timeout=2s;
    server 127.0.0.1:4001 max_fails=1 fail_timeout=2s;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 8080;

    location / {
      proxy_pass http://application;
      proxy_next_upstream error timeout http_502 http_503;
      proxy_http_version 1.1;
      # LiveView and any other WebSocket
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
    }
  }
}
