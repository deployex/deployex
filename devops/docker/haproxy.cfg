# The one port the outside sees. DeployEx runs the application on base + 0..replicas, and
# moves it between them on a full deployment, so every port it can use is listed, and
# HAProxy asks each one, every second, if the application answers there. Only a port that
# does gets requests: the new instance of a full deployment once it is ready, and the
# previous one until it is stopped.
# A port that starts or stops answering is written to the output of the container.
defaults
  mode http
  timeout connect 2s
  timeout client 60s
  timeout server 60s
  # LiveView and any other WebSocket
  timeout tunnel 1h
  # A request to an instance that was just stopped is sent again, to the other port
  retries 2
  option redispatch

frontend outside
  bind :8080
  option forwardfor
  http-request set-header X-Forwarded-Proto http unless { req.hdr(X-Forwarded-Proto) -m found }
  default_backend application

backend application
  # What says the application is ready for requests. Name its readiness path here when it
  # has one, /readyz for instance: a port that is open is not always an application that
  # can answer
  option httpchk
  http-check send meth GET uri / ver HTTP/1.1 hdr Host localhost
  http-check expect status 200
  default-server check inter 1s fall 2 rise 2
  server port0 127.0.0.1:4000
  server port1 127.0.0.1:4001
