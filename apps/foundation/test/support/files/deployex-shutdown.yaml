account_name: "prod"
hostname: "deployex.example.com"
port: 5001
release_adapter: "s3"
release_bucket: "myapp-prod-distribution"
secrets_adapter: "aws"
secrets_path: "deployex-prod-secrets"
aws_region: "us-east-2"
version: "0.10.0"
otp_version: 29
os_target: "ubuntu-24.04"
applications:
  - name: "myphoenixapp"
    language: "elixir"
    replicas: 1
    shutdown_timeout_ms: 30000
    replica_ports:
      - key: PORT
        base: 4000
  - name: "myumbrella"
    language: "elixir"
    replicas: 1
    shutdown_timeout_ms: 0
    replica_ports:
      - key: PORT
        base: 4050
